
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu — Profile & Stats</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      /* Modern Academic Palette */
      --bg: oklch(99% 0 0);
      --surface: oklch(97% 0 0);
      --surface-alt: oklch(94% 0 0);
      --fg: oklch(15% 0 0);
      --muted: oklch(55% 0 0);
      --border: oklch(92% 0 0);
      
      /* Electric Violet Accent */
      --accent: oklch(45% 0.28 290);
      --accent-muted: oklch(95% 0.05 290);
      --error: oklch(55% 0.15 25);
      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      
      /* Bouncy Spring Physics */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      color: var(--fg);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Hardware Frame */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 54px;
      box-shadow: 0 0 0 12px #0f0f0f, 0 0 0 14px #333, 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Status Bar */
    .status-bar {
      height: 54px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 90;
      position: relative;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 100;
    }

    /* App Container */
    .app-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 12px 24px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: var(--bg);
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.9);
      background: var(--surface-alt);
    }

    /* Scrollable Content */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 100px; /* padding-bottom for tab bar */
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .content-scroll::-webkit-scrollbar { display: none; }

    /* State Wrappers */
    .state-wrapper {
      animation: fadeIn 0.4s var(--spring);
      display: flex;
      flex-direction: column;
      gap: 32px;
      height: 100%;
    }
    .center-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 64px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Profile Hero */
    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .avatar-container {
      position: relative;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-muted);
      border: 2px solid var(--bg);
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 32px;
      font-weight: 600;
      font-family: var(--font-display);
    }
    .level-badge {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      border: 2px solid var(--bg);
      white-space: nowrap;
    }
    .profile-info h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .profile-info p {
      color: var(--muted);
      font-size: 15px;
    }

    /* Stats Bento */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-card.wide {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Activity Chart Placeholder */
    .section-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title span {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
    }
    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      margin-bottom: 12px;
      gap: 8px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bar-track {
      width: 100%;
      height: 100px;
      background: var(--surface-alt);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .bar-fill {
      width: 100%;
      background: var(--accent);
      border-radius: 6px;
      transition: height 1s var(--spring);
    }
    .bar-day {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    /* Tab Bar */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 16px 24px;
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      width: 64px;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s var(--spring);
    }
    .tab-item:active {
      transform: scale(0.9);
    }
    .tab-item.active {
      color: var(--accent);
    }
    .tab-label {
      font-size: 11px;
      font-weight: 600;
    }

    /* Loading State */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-alt) 0%, var(--border) 50%, var(--surface-alt) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Empty / Error States */
    .state-icon {
      width: 72px;
      height: 72px;
      border-radius: 36px;
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .state-icon.error {
      background: color-mix(in srgb, var(--error) 15%, transparent);
      color: var(--error);
    }
    .state-title {
      font-family: var(--font-display);
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--fg);
    }
    .state-desc {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
      max-width: 280px;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 24px;
      height: 48px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      transition: transform 0.2s var(--spring), opacity 0.2s;
    }
    .btn-primary:active {
      transform: scale(0.95);
    }

    /* Tweaks Panel */
    .tweaks-panel {
      position: absolute;
      top: 54px;
      right: -240px;
      width: 200px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      z-index: 1000;
      transition: right 0.4s var(--spring);
    }
    .device-frame:hover .tweaks-panel {
      right: 24px;
    }
    .tweaks-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .tweak-btn {
      width: 100%;
      padding: 10px;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--fg);
    }
    .tweak-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SVGIcon = ({ name, className }) => {
      const icons = {
        settings: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
        flame: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>,
        cards: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10v.01"></path><path d="M6 14v.01"></path></svg>,
        clock: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
        home: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
        compass: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>,
        user: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
        empty: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path></svg>,
        alert: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      };
      return icons[name] || null;
    };

    const App = () => {
      const [uxState, setUxState] = useState('populated'); // populated, loading, empty, error

      // Bar chart data for Populated state
      const chartData = [
        { day: 'Mon', val: 40 },
        { day: 'Tue', val: 70 },
        { day: 'Wed', val: 45 },
        { day: 'Thu', val: 90 },
        { day: 'Fri', val: 30 },
        { day: 'Sat', val: 10 },
        { day: 'Sun', val: 0 }
      ];

      return (
        <div className="device-frame">
          <div className="dynamic-island"></div>
          
          <div className="status-bar">
            <span style={{marginLeft: '14px'}}>9:41</span>
            <div className="status-icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M11 2c-3.9 0-7.3 1.9-9.5 4.8L0 5.1C2.6 1.9 6.6 0 11 0s8.4 1.9 11 5.1l-1.5 1.7C18.3 3.9 14.9 2 11 2zm0 4c-1.9 0-3.6.8-4.8 2.1l-1.5-1.7C6.3 4.9 8.5 4 11 4s4.7.9 6.3 2.4l-1.5 1.7C14.6 6.8 12.9 6 11 6zm0 4c-.5 0-.9.2-1.3.5l1.3 1.5 1.3-1.5c-.4-.3-.8-.5-1.3-.5z"/></svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="1" y="2" width="20" height="8" rx="2" stroke="currentColor" strokeWidth="1" fill="none"/><rect x="3" y="4" width="12" height="4" rx="1"/><path d="M23 4v4c1.1 0 2-.9 2-2s-.9-2-2-2z"/></svg>
            </div>
          </div>

          <div className="app-root">
            <header className="header">
              <h1 className="header-title">Profile</h1>
              <div className="header-actions">
                <button className="icon-btn" aria-label="Settings">
                  <SVGIcon name="settings" />
                </button>
              </div>
            </header>

            <div className="content-scroll">
              
              {uxState === 'loading' && (
                <div className="state-wrapper">
                  <div className="profile-hero">
                    <div className="skeleton" style={{width: 96, height: 96, borderRadius: '50%'}}></div>
                    <div className="skeleton" style={{width: 140, height: 28, marginTop: 12}}></div>
                    <div className="skeleton" style={{width: 100, height: 16}}></div>
                  </div>
                  <div className="stats-grid">
                    <div className="stat-card wide skeleton" style={{height: 80}}></div>
                    <div className="stat-card skeleton" style={{height: 120}}></div>
                    <div className="stat-card skeleton" style={{height: 120}}></div>
                  </div>
                  <div>
                    <div className="skeleton" style={{width: 120, height: 24, marginBottom: 16}}></div>
                    <div className="activity-card skeleton" style={{height: 180}}></div>
                  </div>
                </div>
              )}

              {uxState === 'empty' && (
                <div className="state-wrapper center-state">
                  <div className="state-icon">
                    <SVGIcon name="empty" />
                  </div>
                  <h2 className="state-title">No stats yet</h2>
                  <p className="state-desc">Your learning progress will appear here once you complete your first session.</p>
                  <button className="btn-primary" onClick={() => setUxState('populated')}>
                    Start Learning
                  </button>
                </div>
              )}

              {uxState === 'error' && (
                <div className="state-wrapper center-state">
                  <div className="state-icon error">
                    <SVGIcon name="alert" />
                  </div>
                  <h2 className="state-title">Unable to load</h2>
                  <p className="state-desc">We couldn't retrieve your profile data. Please check your connection.</p>
                  <button className="btn-primary" onClick={() => {
                    setUxState('loading');
                    setTimeout(() => setUxState('populated'), 1200);
                  }}>
                    Retry
                  </button>
                </div>
              )}

              {uxState === 'populated' && (
                <div className="state-wrapper">
                  <section className="profile-hero" data-od-id="profile-hero">
                    <div className="avatar-container">
                      <div className="avatar">A</div>
                      <div className="level-badge">Level 4</div>
                    </div>
                    <div className="profile-info">
                      <h2>Alex Student</h2>
                      <p>Socratic Scholar</p>
                    </div>
                  </section>

                  <section className="stats-grid" data-od-id="stats-grid">
                    <div className="stat-card wide">
                      <div>
                        <div className="stat-label">Current Streak</div>
                        <div className="stat-value" style={{color: 'var(--accent)'}}>12 Days</div>
                      </div>
                      <div className="stat-icon" style={{background: 'var(--accent-muted)'}}>
                        <SVGIcon name="flame" />
                      </div>
                    </div>
                    
                    <div className="stat-card">
                      <div className="stat-icon">
                        <SVGIcon name="cards" />
                      </div>
                      <div>
                        <div className="stat-value">428</div>
                        <div className="stat-label">Cards Mastered</div>
                      </div>
                    </div>
                    
                    <div className="stat-card">
                      <div className="stat-icon">
                        <SVGIcon name="clock" />
                      </div>
                      <div>
                        <div className="stat-value">18.5</div>
                        <div className="stat-label">Hours Focused</div>
                      </div>
                    </div>
                  </section>

                  <section data-od-id="activity-chart">
                    <h3 className="section-title">
                      Activity <span>This Week</span>
                    </h3>
                    <div className="activity-card">
                      <div className="chart-bars">
                        {chartData.map((d, i) => (
                          <div className="bar-col" key={i}>
                            <div className="bar-track">
                              <div 
                                className="bar-fill" 
                                style={{
                                  height: `${d.val}%`, 
                                  opacity: d.val === 0 ? 0.2 : 1,
                                  background: d.val === 90 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 70%, transparent)'
                                }}
                              ></div>
                            </div>
                            <div className="bar-day" style={{color: d.val === 90 ? 'var(--fg)' : 'var(--muted)'}}>{d.day}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                </div>
              )}

            </div>

            <nav className="tab-bar" data-od-id="tab-bar">
              <a href="#" className="tab-item">
                <SVGIcon name="home" />
                <span className="tab-label">Home</span>
              </a>
              <a href="#" className="tab-item">
                <SVGIcon name="compass" />
                <span className="tab-label">Discover</span>
              </a>
              <a href="#" className="tab-item active">
                <SVGIcon name="user" />
                <span className="tab-label">Profile</span>
              </a>
            </nav>
          </div>

          <div className="tweaks-panel">
            <div className="tweaks-title">State Explorer</div>
            {['populated', 'loading', 'empty', 'error'].map(s => (
              <button 
                key={s}
                className={`tweak-btn ${uxState === s ? 'active' : ''}`}
                onClick={() => setUxState(s)}
              >
                {s.charAt(0).toUpperCase() + s.slice(1)} State
              </button>
            ))}
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
