
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu - Tutor</title>
  <style>
    :root {
      /* Modern minimal palette */
      --bg: oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg: oklch(18% 0.012 250);
      --muted: oklch(54% 0.012 250);
      --border: oklch(92% 0.005 250);
      --accent: oklch(58% 0.18 255);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 24px;
      
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --duration: 150ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: oklch(95% 0.005 250);
    }

    .device-frame {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 0 0 10px oklch(85% 0.01 250);
      display: flex;
      flex-direction: column;
    }

    /* iOS Status Bar */
    .status-bar {
      height: 47px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }
    
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: black;
      border-radius: 16px;
    }

    /* Header */
    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      z-index: 5;
    }

    .header-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .back-btn, .action-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--fg);
      cursor: pointer;
      margin: -10px; /* Expand hit area */
      transition: opacity var(--duration) var(--ease);
    }
    
    .back-btn:active, .action-btn:active {
      opacity: 0.5;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scrollbar-width: none; /* Firefox */
    }
    .chat-area::-webkit-scrollbar { display: none; } /* Chrome */

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .message.tutor {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      line-height: 1.5;
    }

    .tutor .message-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      border-bottom-left-radius: 4px;
    }

    .user .message-bubble {
      background: var(--fg);
      color: var(--bg);
      border-bottom-right-radius: 4px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    
    .tutor .message-meta { margin-left: 2px; }
    .user .message-meta { text-align: right; margin-right: 2px; }

    /* Typing Indicator State */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
      display: none;
    }
    
    .typing-indicator.active {
      display: flex;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area {
      padding: 16px 24px 34px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      transition: border-color var(--duration) var(--ease);
    }
    
    .input-wrapper:focus-within {
      border-color: var(--fg);
    }

    .chat-input {
      width: 100%;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--fg);
      resize: none;
      max-height: 100px;
      outline: none;
    }

    .chat-input::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--fg);
      color: var(--bg);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform var(--duration) var(--ease), opacity var(--duration) var(--ease), background var(--duration) var(--ease);
    }

    .send-btn:active {
      transform: scale(0.92);
    }
    
    .send-btn:disabled {
      background: var(--muted);
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(1);
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="dynamic-island"></div>
      <div class="icons">
        <svg width="68" height="14" viewBox="0 0 68 14" fill="none">
          <path d="M18 4H20V10H18V4Z" fill="currentColor"/>
          <path d="M22 2H24V10H22V2Z" fill="currentColor"/>
          <path d="M14 6H16V10H14V6Z" fill="currentColor"/>
          <path d="M10 8H12V10H10V8Z" fill="currentColor"/>
          <path d="M36 3.5C36 3.5 37.5 2 41 2C44.5 2 46 3.5 46 3.5L41 9L36 3.5Z" fill="currentColor"/>
          <path d="M54 3.5V10.5H65V3.5H54Z" fill="currentColor"/>
          <path d="M66 5.5V8.5" stroke="currentColor"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <header class="header">
      <button class="back-btn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="header-title" data-od-id="header-title">Physics Tutor</div>
      <button class="action-btn" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </header>

    <!-- Chat Interface -->
    <main class="chat-area" id="chatContainer" data-od-id="chat-area">
      <div class="message tutor">
        <div class="message-bubble" data-od-id="msg-tutor-1">
          Let's continue with classical mechanics. We left off discussing the conservation of momentum. Are you ready for a practice problem?
        </div>
        <div class="message-meta">Tutor • 9:38 AM</div>
      </div>
      
      <div class="message user">
        <div class="message-bubble" data-od-id="msg-user-1">
          Yes, but can we review inelastic collisions briefly first?
        </div>
        <div class="message-meta">You • 9:40 AM</div>
      </div>
      
      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </main>

    <!-- Chat Input -->
    <div class="input-area" data-od-id="input-area">
      <div class="input-wrapper">
        <input type="text" class="chat-input" id="chatInput" placeholder="Message tutor..." autocomplete="off" aria-label="Message text" />
      </div>
      <button class="send-btn" id="sendBtn" disabled aria-label="Send message" data-od-id="send-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Frame Bottom -->
    <div class="home-indicator"></div>
  </div>

  <script>
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContainer = document.getElementById('chatContainer');
    const typingIndicator = document.getElementById('typingIndicator');

    // 150ms State-Confirmation on input processing
    input.addEventListener('input', (e) => {
      sendBtn.disabled = e.target.value.trim().length === 0;
    });

    const sendMessage = () => {
      const text = input.value.trim();
      if (!text) return;

      // 1. Create and render user message optimistically
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `
        <div class="message-bubble">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
        <div class="message-meta">You • Just now</div>
      `;
      
      chatContainer.insertBefore(userMsg, typingIndicator);
      
      input.value = '';
      sendBtn.disabled = true;
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 2. Loading state: activate typing indicator
      typingIndicator.classList.add('active');
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 3. Resolve state and simulate response latency
      setTimeout(() => {
        typingIndicator.classList.remove('active');
        
        const tutorMsg = document.createElement('div');
        tutorMsg.className = 'message tutor';
        tutorMsg.innerHTML = `
          <div class="message-bubble">I can help with that. In an inelastic collision, kinetic energy is not conserved, though momentum still is. Want me to break down the formula?</div>
          <div class="message-meta">Tutor • Just now</div>
        `;
        
        chatContainer.insertBefore(tutorMsg, typingIndicator);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 1800);
    };

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
