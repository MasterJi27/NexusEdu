
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu — Socratic Tutor</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      /* Modern Academic Palette */
      --bg: oklch(99% 0 0);
      --surface: oklch(97% 0 0);
      --surface-alt: oklch(94% 0 0);
      --fg: oklch(15% 0 0);
      --muted: oklch(55% 0 0);
      --border: oklch(92% 0 0);
      
      /* Electric Violet Accent */
      --accent: oklch(45% 0.28 290);
      --accent-muted: oklch(95% 0.05 290);
      --error: oklch(55% 0.15 25);
      --error-muted: oklch(95% 0.05 25);
      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      
      /* Bouncy Spring Physics */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e5e5e5;
      color: var(--fg);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      gap: 40px;
    }

    /* Hardware Frame */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 54px;
      box-shadow: 0 0 0 12px #0f0f0f, 0 0 0 14px #333, 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* Hardware Chrome */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }
    .status-bar {
      height: 54px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 90;
      position: relative;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 100;
    }

    /* Header */
    .header {
      padding: 12px 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
    }
    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      margin-left: -12px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active { background: var(--surface-alt); }
    
    .header-info { flex: 1; }
    .header-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
    }
    .header-subtitle {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-subtitle::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }
    
    .menu-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      margin-right: -12px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .menu-btn:active { background: var(--surface-alt); }

    /* Chat Scroll Area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }
    .chat-scroll::-webkit-scrollbar { display: none; }

    /* Empty State (First-use Onboarding) */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: popIn 0.5s var(--spring) forwards;
      padding: 0 12px;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 32px;
      background: var(--accent-muted);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .empty-title {
      font-family: var(--font-display);
      font-size: 24px;
      margin-bottom: 8px;
    }
    .empty-desc {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    
    .suggestion-pills {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .pill {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s var(--spring);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill:active {
      transform: scale(0.97);
      background: var(--surface-alt);
    }
    .pill-icon { color: var(--accent); }

    /* Chat Bubbles */
    .bubble-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 88%;
      animation: popIn 0.5s var(--spring) forwards;
    }
    .bubble-row.ai { 
      align-self: flex-start; 
      transform-origin: bottom left; 
    }
    .bubble-row.user { 
      align-self: flex-end; 
      align-items: flex-end; 
      transform-origin: bottom right; 
    }
    
    .bubble {
      padding: 14px 18px;
      font-size: 16px;
      line-height: 1.5;
      border-radius: 20px;
    }
    .bubble.ai {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--fg);
    }
    .bubble.user {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    
    /* Error Bubble */
    .bubble.error {
      background: var(--error-muted);
      border: 1px solid oklch(90% 0.05 25);
      color: var(--error);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom-left-radius: 4px;
    }
    .retry-btn {
      background: var(--error);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: transform 0.2s var(--spring);
    }
    .retry-btn:active { transform: scale(0.95); }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 18px 20px;
      align-items: center;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Input Area */
    .input-area {
      padding: 12px 24px 34px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }
    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--accent);
    }
    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 16px;
      color: var(--fg);
      outline: none;
      font-family: var(--font-body);
    }
    .input-box input::placeholder { color: var(--muted); }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), opacity 0.2s;
    }
    .send-btn:active { transform: scale(0.85); }
    .send-btn:disabled {
      background: var(--surface-alt);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
    }

    /* Tweaks Panel for Design Review */
    .tweaks-panel {
      width: 280px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .tweaks-title {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .tweak-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tweak-btn {
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      color: var(--fg);
    }
    .tweak-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
      // Manage UX State: 'empty' | 'populated' | 'loading' | 'error'
      const [viewState, setViewState] = useState('populated');
      const chatEndRef = useRef(null);

      // Scroll to bottom cleanly when state changes
      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [viewState]);

      return (
        <React.Fragment>
          {/* Main App Frame */}
          <div className="device-frame" data-od-id="iphone-frame">
            <div className="dynamic-island"></div>
            
            <div className="status-bar">
              <span>9:41</span>
              <div className="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
                  <path d="M12.5 0C10.8 0 9.2 0.7 8 1.9L9.5 3.3C10.3 2.6 11.4 2.1 12.5 2.1C13.6 2.1 14.7 2.6 15.5 3.3L17 1.9C15.8 0.7 14.2 0 12.5 0ZM12.5 4.2C11.7 4.2 10.9 4.6 10.3 5.1L12.5 7.4L14.7 5.1C14.1 4.6 13.3 4.2 12.5 4.2Z"/>
                  <path d="M4 8H0V12H4V8Z" />
                  <path d="M9 5H5V12H9V5Z" />
                  <path d="M14 2H10V12H14V2Z" />
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
                  <path d="M21 3H3C1.3 3 0 4.3 0 6C0 7.7 1.3 9 3 9H21C22.7 9 24 7.7 24 6C24 4.3 22.7 3 21 3ZM21 7H3C2.4 7 2 6.6 2 6C2 5.4 2.4 5 3 5H21C21.6 5 22 5.4 22 6C22 6.6 21.6 7 21 7Z"/>
                  <rect x="2" y="4" width="18" height="4" rx="1"/>
                </svg>
              </div>
            </div>

            <div className="app-root">
              {/* Header */}
              <header className="header" data-od-id="tutor-header">
                <button className="back-btn" aria-label="Go back">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                  </svg>
                </button>
                <div className="header-info">
                  <h1 className="header-title">Socratic Tutor</h1>
                  <div className="header-subtitle">Active Session</div>
                </div>
                <button className="menu-btn" aria-label="Menu">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <circle cx="12" cy="12" r="1"/>
                    <circle cx="12" cy="5" r="1"/>
                    <circle cx="12" cy="19" r="1"/>
                  </svg>
                </button>
              </header>

              {/* Chat View */}
              <main className="chat-scroll" data-od-id="chat-scroll-area">
                {viewState === 'empty' ? (
                  <div className="empty-state" data-od-id="empty-state">
                    <div className="empty-icon">
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                      </svg>
                    </div>
                    <h2 className="empty-title">Let's Think Together</h2>
                    <p className="empty-desc">I won't just give you the answers. We'll reason through the concepts step-by-step.</p>
                    
                    <div className="suggestion-pills">
                      <button className="pill">
                        <span>Explain quantum entanglement</span>
                        <svg className="pill-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      </button>
                      <button className="pill">
                        <span>Help me with my calculus homework</span>
                        <svg className="pill-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      </button>
                      <button className="pill">
                        <span>Why did the Roman Empire fall?</span>
                        <svg className="pill-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      </button>
                    </div>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="bubble-row user" data-od-id="msg-user-1">
                      <div className="bubble user">I'm having trouble understanding Newton's Third Law. It says every action has an equal and opposite reaction.</div>
                    </div>
                    
                    <div className="bubble-row ai" data-od-id="msg-ai-1" style={{ animationDelay: '0.1s' }}>
                      <div className="bubble ai">That's right. To break that down, let's think about a real-world example. Imagine you are standing on a skateboard and you throw a heavy bowling ball forward. What do you think happens to you and the skateboard?</div>
                    </div>

                    <div className="bubble-row user" data-od-id="msg-user-2" style={{ animationDelay: '0.2s' }}>
                      <div className="bubble user">I guess I would roll backward?</div>
                    </div>

                    {(viewState === 'populated' || viewState === 'loading' || viewState === 'error') && (
                      <div className="bubble-row ai" data-od-id="msg-ai-2" style={{ animationDelay: '0.3s' }}>
                        <div className="bubble ai">Exactly! You push the ball forward (the action), and the ball pushes you backward (the reaction). Now, are those two forces pushing on the same object, or different objects?</div>
                      </div>
                    )}

                    {viewState === 'loading' && (
                      <div className="bubble-row ai" data-od-id="msg-loading">
                        <div className="bubble ai typing-indicator">
                          <span className="dot"></span>
                          <span className="dot"></span>
                          <span className="dot"></span>
                        </div>
                      </div>
                    )}

                    {viewState === 'error' && (
                      <div className="bubble-row ai" data-od-id="msg-error">
                        <div className="bubble error">
                          <p>Network unreachable — unable to connect to the tutor engine. Please check your connection.</p>
                          <button className="retry-btn">Retry Connection</button>
                        </div>
                      </div>
                    )}
                  </React.Fragment>
                )}
                {/* Scroll Anchor */}
                <div ref={chatEndRef} style={{ height: 1 }} />
              </main>

              {/* Input */}
              <div className="input-area" data-od-id="input-area">
                <div className="input-box">
                  <input 
                    type="text" 
                    placeholder="Type your response..." 
                    disabled={viewState === 'loading'}
                  />
                  <button className="send-btn" disabled={viewState === 'loading'} aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                  </button>
                </div>
              </div>

              <div className="home-indicator"></div>
            </div>
          </div>

          {/* Tweaks Panel for Design Review */}
          <aside className="tweaks-panel">
            <h3 className="tweaks-title">UX State Coverage</h3>
            <div className="tweak-group">
              {['empty', 'populated', 'loading', 'error'].map(state => (
                <button 
                  key={state}
                  className={`tweak-btn ${viewState === state ? 'active' : ''}`}
                  onClick={() => setViewState(state)}
                >
                  {state.charAt(0).toUpperCase() + state.slice(1)} State
                </button>
              ))}
            </div>
          </aside>
        </React.Fragment>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
