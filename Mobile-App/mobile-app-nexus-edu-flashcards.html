
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu — Flashcard Engine</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      /* Modern Academic Palette */
      --bg: oklch(99% 0 0);
      --surface: oklch(100% 0 0);
      --surface-alt: oklch(96% 0 0);
      --fg: oklch(15% 0 0);
      --muted: oklch(55% 0 0);
      --border: oklch(92% 0 0);
      
      /* Electric Violet Accent */
      --accent: oklch(45% 0.28 290);
      --accent-muted: oklch(95% 0.05 290);
      --success: oklch(60% 0.15 150);
      --error: oklch(55% 0.15 25);
      --warning: oklch(75% 0.15 75);
      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      
      /* Bouncy Spring Physics */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      color: var(--fg);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Hardware Frame */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--surface-alt);
      border-radius: 54px;
      box-shadow: 0 0 0 12px #0f0f0f, 0 0 0 14px #333, 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Status Bar */
    .status-bar {
      height: 54px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 90;
      position: relative;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 100;
    }

    /* App Container */
    .app-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    .header {
      padding: 12px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s, transform 0.2s var(--spring);
      margin-left: -12px;
    }
    .icon-btn.right {
      margin-left: 0;
      margin-right: -12px;
    }
    .icon-btn:active {
      background: var(--border);
      transform: scale(0.9);
    }
    .progress-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-pill svg {
      color: var(--accent);
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 0 24px;
    }

    /* Flashcard Container (3D Context) */
    .flashcard-scene {
      flex: 1;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-bottom: 40px;
    }

    .flashcard {
      width: 100%;
      height: 440px;
      position: relative;
      transition: transform 0.6s var(--spring);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }
    
    .flashcard.animating-out {
      animation: swipeOut 0.5s var(--spring) forwards;
    }
    .flashcard.animating-in {
      animation: swipeIn 0.5s var(--spring) forwards;
    }

    @keyframes swipeOut {
      0% { transform: translateX(0) rotate(0); opacity: 1; }
      100% { transform: translateX(-150%) rotate(-10deg); opacity: 0; }
    }
    @keyframes swipeIn {
      0% { transform: translateX(150%) rotate(10deg); opacity: 0; }
      100% { transform: translateX(0) rotate(0); opacity: 1; }
    }

    /* Front & Back Faces */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      padding: 32px;
      overflow: hidden;
    }

    .card-face.back {
      transform: rotateY(180deg);
      background: var(--bg);
      border: 2px solid var(--accent-muted);
    }

    /* Card Content */
    .card-badge {
      align-self: flex-start;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    
    .card-front .card-badge { color: var(--accent); }

    .card-text {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.3;
      color: var(--fg);
    }

    .card-hint {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0.7;
    }

    /* Controls Area */
    .controls-area {
      padding: 0 24px 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      opacity: 1;
      transition: opacity 0.3s;
    }
    .controls-area.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .action-btn {
      height: 64px;
      border-radius: 32px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s var(--spring), filter 0.2s;
    }
    .action-btn:active {
      transform: scale(0.95);
    }
    .action-btn.secondary {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      max-width: 120px;
    }
    .action-btn.primary {
      flex: 2;
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 16px rgba(116, 27, 219, 0.25);
    }
    .action-btn.danger {
      background: var(--error);
      color: white;
      box-shadow: 0 8px 16px rgba(220, 38, 38, 0.2);
    }

    /* UI States (Empty, Loading, Error) */
    .state-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
      animation: fadeUp 0.5s var(--spring) forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .state-icon {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .state-icon.success { background: oklch(95% 0.05 150); color: var(--success); }
    .state-icon.error { background: oklch(95% 0.05 25); color: var(--error); }
    
    .state-title {
      font-family: var(--font-display);
      font-size: 24px;
      margin-bottom: 12px;
    }
    .state-desc {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    
    .skeleton-card {
      width: 100%;
      height: 440px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 32px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .skeleton-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .skel-badge { width: 80px; height: 16px; background: var(--border); border-radius: 4px; margin-bottom: auto; }
    .skel-text { width: 80%; height: 32px; background: var(--border); border-radius: 4px; margin: 0 auto; align-self: center; }
    .skel-text-2 { width: 60%; height: 32px; background: var(--border); border-radius: 4px; margin: 12px auto auto auto; align-self: center; }
    .skel-footer { width: 120px; height: 16px; background: var(--border); border-radius: 4px; margin: auto auto 0 auto; }

    /* Tweaks Panel */
    .tweaks-panel {
      position: fixed;
      right: 24px;
      top: 24px;
      width: 240px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .tweaks-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .tweak-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-body);
      color: var(--fg);
    }
    .tweak-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const deckData = [
      { id: 1, topic: 'Neuroscience', front: 'What is the primary function of the myelin sheath?', back: 'To increase the speed at which electrical impulses propagate along the myelinated fiber.' },
      { id: 2, topic: 'Philosophy', front: 'Define Kant\'s Categorical Imperative.', back: 'Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.' },
      { id: 3, topic: 'Computer Science', front: 'Explain the difference between a stack and a queue.', back: 'Stack is LIFO (Last-In, First-Out), Queue is FIFO (First-In, First-Out).' }
    ];

    function DeviceFrame({ children }) {
      return (
        <div className="device-frame">
          <div className="dynamic-island"></div>
          <div className="status-bar">
            <span>9:41</span>
            <div className="status-icons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                <path d="M1 9.5C3.5 7 6.5 5.5 9 5.5C11.5 5.5 14.5 7 17 9.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                <path d="M4 6.5C5.5 5 7.5 4 9 4C10.5 4 12.5 5 14 6.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                <path d="M7 3.5C8 2.5 8.5 2 9 2C9.5 2 10 2.5 11 3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
              </svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
                <rect x="1" y="2" width="20" height="8" rx="2.5" stroke="currentColor" strokeWidth="1.5"/>
                <path d="M23 4V8" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                <rect x="3" y="4" width="16" height="4" rx="1" fill="currentColor"/>
              </svg>
            </div>
          </div>
          <div className="app-root">
            {children}
          </div>
          <div className="home-indicator"></div>
        </div>
      );
    }

    function App() {
      const [appState, setAppState] = useState('populated'); // populated, loading, empty, error
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [animating, setAnimating] = useState(''); // 'out', 'in', ''
      
      const currentCard = deckData[currentIndex];

      const handleNext = () => {
        if (animating) return;
        setAnimating('out');
        setTimeout(() => {
          if (currentIndex < deckData.length - 1) {
            setCurrentIndex(prev => prev + 1);
            setIsFlipped(false);
            setAnimating('in');
            setTimeout(() => setAnimating(''), 500);
          } else {
            setAppState('empty');
            setAnimating('');
          }
        }, 300);
      };

      const handleReset = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setAppState('populated');
      };

      return (
        <>
          <DeviceFrame>
            {/* Header */}
            <div className="header" data-od-id="header-nav">
              <button className="icon-btn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
              </button>
              
              {appState === 'populated' && (
                <div className="progress-pill" data-od-id="deck-progress">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                  </svg>
                  {currentIndex + 1} / {deckData.length}
                </div>
              )}

              <button className="icon-btn right" aria-label="Deck settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>

            {/* Content Area */}
            <div className="content-area">
              
              {appState === 'populated' && currentCard && (
                <div className="flashcard-scene" data-od-id="flashcard-engine">
                  <div 
                    className={`flashcard ${isFlipped ? 'flipped' : ''} ${animating ? `animating-${animating}` : ''}`}
                    onClick={() => !animating && setIsFlipped(!isFlipped)}
                  >
                    {/* Front */}
                    <div className="card-face card-front">
                      <div className="card-badge">{currentCard.topic}</div>
                      <div className="card-text">{currentCard.front}</div>
                      <div className="card-hint">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M2 12h4l3-9 5 18 3-9h5"/>
                        </svg>
                        Tap to reveal
                      </div>
                    </div>
                    {/* Back */}
                    <div className="card-face card-back back">
                      <div className="card-badge">Answer</div>
                      <div className="card-text">{currentCard.back}</div>
                    </div>
                  </div>
                </div>
              )}

              {appState === 'loading' && (
                <div className="flashcard-scene" data-od-id="loading-state">
                  <div className="skeleton-card">
                    <div className="skel-badge"></div>
                    <div className="skel-text"></div>
                    <div className="skel-text-2"></div>
                    <div className="skel-footer"></div>
                  </div>
                </div>
              )}

              {appState === 'empty' && (
                <div className="state-container" data-od-id="empty-state">
                  <div className="state-icon success">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                      <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                  </div>
                  <h2 className="state-title">All Caught Up!</h2>
                  <p className="state-desc">You've mastered all the flashcards in this deck. Time for a well-deserved break.</p>
                  <button className="action-btn primary" onClick={handleReset} style={{ width: '100%', maxWidth: '200px' }}>
                    Review Again
                  </button>
                </div>
              )}

              {appState === 'error' && (
                <div className="state-container" data-od-id="error-state">
                  <div className="state-icon error">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <circle cx="12" cy="12" r="10"/>
                      <line x1="12" y1="8" x2="12" y2="12"/>
                      <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                  </div>
                  <h2 className="state-title">Sync Failed</h2>
                  <p className="state-desc">We couldn't load your deck due to a network error. Check your connection.</p>
                  <button className="action-btn secondary" onClick={() => setAppState('populated')} style={{ width: '100%', maxWidth: '200px' }}>
                    Retry
                  </button>
                </div>
              )}

            </div>

            {/* Controls */}
            <div className={`controls-area ${appState !== 'populated' ? 'hidden' : ''}`} data-od-id="action-controls">
              <button className="action-btn secondary" onClick={handleNext}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
                Skip
              </button>
              <button className={`action-btn ${isFlipped ? 'primary' : 'secondary'}`} onClick={handleNext} style={!isFlipped ? {opacity: 0.5, pointerEvents: 'none'} : {}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 6L9 17l-5-5"/>
                </svg>
                Got It
              </button>
            </div>
            
          </DeviceFrame>

          {/* Tweaks Panel (Outside Device) */}
          <div className="tweaks-panel">
            <div className="tweaks-title">UX State Testing</div>
            {['populated', 'loading', 'empty', 'error'].map(state => (
              <button 
                key={state}
                className={`tweak-btn ${appState === state ? 'active' : ''}`}
                onClick={() => setAppState(state)}
              >
                {state.charAt(0).toUpperCase() + state.slice(1)} State
              </button>
            ))}
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
