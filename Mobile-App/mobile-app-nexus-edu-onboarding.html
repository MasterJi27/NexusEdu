
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu — Onboarding</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      /* Modern Academic Palette */
      --bg: oklch(99% 0 0);
      --surface: oklch(97% 0 0);
      --surface-alt: oklch(94% 0 0);
      --fg: oklch(15% 0 0);
      --muted: oklch(55% 0 0);
      --border: oklch(92% 0 0);
      
      /* Electric Violet Accent */
      --accent: oklch(45% 0.28 290);
      --accent-muted: oklch(95% 0.05 290);
      --error: oklch(55% 0.15 25);
      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      
      /* Bouncy Spring Physics */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      color: var(--fg);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Hardware Frame */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 54px;
      box-shadow: 0 0 0 12px #0f0f0f, 0 0 0 14px #333, 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Status Bar */
    .status-bar {
      height: 54px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 90;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 100;
    }

    /* App Container */
    .app-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Carousel Wrapper */
    .carousel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .slide-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s var(--spring);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 100px 32px 140px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .slide-graphic {
      width: 240px;
      height: 240px;
      background: var(--surface-alt);
      border-radius: 50%;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid var(--border);
    }
    
    .slide-graphic-inner {
      width: 160px;
      height: 160px;
      background: var(--accent-muted);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transform: rotate(-5deg);
      box-shadow: 0 12px 24px rgba(0,0,0,0.05);
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .slide-desc {
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 280px;
    }

    /* Paginator */
    .paginator {
      position: absolute;
      bottom: 120px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--border);
      transition: all 0.3s var(--spring);
    }
    .dot.active {
      background: var(--accent);
      width: 24px;
    }

    /* Actions Footer */
    .actions-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 24px 34px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    .btn {
      width: 100%;
      height: 56px;
      border-radius: var(--radius-xl);
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.2s var(--spring), opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Auth Screen */
    .auth-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 50;
      padding: 100px 24px 34px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.6s var(--spring);
    }
    .auth-screen.open {
      transform: translateY(0);
    }

    .auth-header {
      margin-bottom: 40px;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: var(--muted);
      font-size: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-field {
      width: 100%;
      height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 16px;
      font-size: 16px;
      font-family: var(--font-body);
      color: var(--fg);
      transition: border-color 0.2s var(--spring), box-shadow 0.2s var(--spring);
      outline: none;
    }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-muted);
    }
    .input-field::placeholder {
      color: var(--muted);
    }
    .input-field.has-error {
      border-color: var(--error);
      box-shadow: 0 0 0 4px oklch(95% 0.05 25);
    }
    
    .error-text {
      color: var(--error);
      font-size: 13px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: popIn 0.3s var(--spring);
    }

    .auth-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .back-nav {
      position: absolute;
      top: 54px;
      left: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-nav:active {
      background: var(--surface-alt);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const slides = [
      {
        title: "The Socratic Tutor",
        desc: "Don't just get the answer. Engage in dialectic dialogue to truly master the material.",
        icon: (
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        )
      },
      {
        title: "Smart Scanner",
        desc: "Point your camera at any textbook or equation. We digitize and explain it instantly.",
        icon: (
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 12h6M12 9v6"/>
          </svg>
        )
      },
      {
        title: "Flashcard Engine",
        desc: "Spaced repetition built automatically from your curriculum. Never forget what matters.",
        icon: (
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        )
      }
    ];

    function App() {
      const [currentSlide, setCurrentSlide] = useState(0);
      const [authMode, setAuthMode] = useState(null); // 'signup', 'login', null
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      const handleNext = () => {
        if (currentSlide < slides.length - 1) {
          setCurrentSlide(c => c + 1);
        } else {
          setAuthMode('signup');
        }
      };

      const handleAuthSubmit = () => {
        setError('');
        
        // Validation
        if (!email.includes('@')) {
          setError('Please enter a valid academic email address.');
          return;
        }
        if (password.length < 6) {
          setError('Password must be at least 6 characters.');
          return;
        }

        setIsLoading(true);
        // Simulate network request
        setTimeout(() => {
          setIsLoading(false);
          // In a real app, this would route to the Dashboard
          alert('Welcome to NexusEdu!');
        }, 1500);
      };

      return (
        <div className="device-frame" data-od-id="device-frame">
          <div className="dynamic-island" data-od-id="dynamic-island"></div>
          
          <div className="status-bar" data-od-id="status-bar">
            <span>9:41</span>
            <div className="status-icons">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21c-5 0-11-2-11-2l1-2s5 1 10 1 10-1 10-1l1 2s-6 2-11 2z"/></svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="20" height="10" rx="2" ry="2"/><path d="M22 11v2"/></svg>
            </div>
          </div>

          <div className="app-root" data-od-id="app-root">
            
            <div className="carousel-container" data-od-id="onboarding-carousel">
              <div 
                className="slide-track" 
                style={{ transform: `translateX(-${currentSlide * 100}%)` }}
              >
                {slides.map((slide, idx) => (
                  <div className="slide" key={idx} data-od-id={`slide-${idx}`}>
                    <div className="slide-graphic">
                      <div className="slide-graphic-inner">
                        {slide.icon}
                      </div>
                    </div>
                    <h2 className="slide-title">{slide.title}</h2>
                    <p className="slide-desc">{slide.desc}</p>
                  </div>
                ))}
              </div>

              <div className="paginator" data-od-id="paginator">
                {slides.map((_, idx) => (
                  <div 
                    key={idx} 
                    className={`dot ${idx === currentSlide ? 'active' : ''}`}
                  />
                ))}
              </div>
            </div>

            <div className="actions-footer" data-od-id="onboarding-actions">
              <button className="btn btn-primary" onClick={handleNext} data-od-id="btn-primary-action">
                {currentSlide === slides.length - 1 ? 'Get Started' : 'Next'}
              </button>
              <button 
                className="btn btn-secondary" 
                onClick={() => setAuthMode('login')}
                data-od-id="btn-login-skip"
              >
                I already have an account
              </button>
            </div>

            {/* Auth Overlay */}
            <div className={`auth-screen ${authMode ? 'open' : ''}`} data-od-id="auth-screen">
              {authMode && (
                <button 
                  className="back-nav" 
                  onClick={() => { setAuthMode(null); setError(''); }}
                  data-od-id="auth-back-btn"
                >
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                  </svg>
                </button>
              )}

              <div className="auth-header">
                <h1 className="auth-title">
                  {authMode === 'signup' ? 'Create Account' : 'Welcome Back'}
                </h1>
                <p className="auth-subtitle">
                  {authMode === 'signup' 
                    ? 'Start mastering your curriculum today.' 
                    : 'Pick up right where you left off.'}
                </p>
              </div>

              <div className="form-group" data-od-id="auth-form">
                <div className="input-wrapper">
                  <input 
                    type="email" 
                    className={`input-field ${error && !email.includes('@') ? 'has-error' : ''}`}
                    placeholder="Academic Email (.edu preferred)"
                    value={email}
                    onChange={(e) => { setEmail(e.target.value); setError(''); }}
                    data-od-id="input-email"
                  />
                </div>
                
                <div className="input-wrapper">
                  <input 
                    type="password" 
                    className={`input-field ${error && password.length < 6 ? 'has-error' : ''}`}
                    placeholder="Password"
                    value={password}
                    onChange={(e) => { setPassword(e.target.value); setError(''); }}
                    data-od-id="input-password"
                  />
                </div>

                {error && (
                  <div className="error-text" data-od-id="auth-error">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    {error}
                  </div>
                )}
              </div>

              <div className="auth-footer" data-od-id="auth-footer-actions">
                <button 
                  className="btn btn-primary" 
                  onClick={handleAuthSubmit}
                  disabled={isLoading || !email || !password}
                  data-od-id="btn-submit-auth"
                >
                  {isLoading ? <div className="spinner" /> : (authMode === 'signup' ? 'Sign Up' : 'Log In')}
                </button>
              </div>
            </div>

          </div>

          <div className="home-indicator" data-od-id="home-indicator"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
