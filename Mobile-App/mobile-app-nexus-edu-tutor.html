
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusEdu — Socratic Tutor</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      /* Modern Academic Palette */
      --bg: oklch(99% 0 0);
      --surface: oklch(97% 0 0);
      --surface-alt: oklch(94% 0 0);
      --fg: oklch(15% 0 0);
      --muted: oklch(55% 0 0);
      --border: oklch(92% 0 0);
      
      /* Electric Violet Accent */
      --accent: oklch(45% 0.28 290);
      --accent-muted: oklch(95% 0.05 290);
      --error: oklch(55% 0.15 25);
      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      
      /* Bouncy Spring Physics */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      color: var(--fg);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Hardware Frame */
    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 54px;
      box-shadow: 0 0 0 12px #0f0f0f, 0 0 0 14px #333, 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Status Bar */
    .status-bar {
      height: 54px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 90;
      position: relative;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      z-index: 100;
    }

    /* App Container */
    .app-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    .header {
      padding: 12px 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
    }
    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      margin-left: -12px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active {
      background: var(--surface-alt);
    }
    .header-info {
      flex: 1;
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
    }
    .header-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Chat Area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .chat-scroll::-webkit-scrollbar { display: none; }

    /* Bubbles */
    .bubble-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 88%;
    }
    .bubble-row.ai {
      align-self: flex-start;
    }
    .bubble-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    
    .bubble {
      padding: 14px 18px;
      font-size: 16px;
      line-height: 1.5;
      border-radius: 20px;
      animation: popIn 0.5s var(--spring) forwards;
      transform-origin: bottom left;
    }
    .bubble-row.user .bubble {
      transform-origin: bottom right;
    }
    .bubble.ai {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--fg);
    }
    .bubble.user {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Input Area */
    .input-area {
      padding: 12px 24px 34px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }
    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 6px 6px 16px;
    }
    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 16px;
      color: var(--fg);
      outline: none;
      font-family: var(--font-body);
    }
    .input-box input::placeholder {
      color: var(--muted);
    }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), opacity 0.2s;
    }
    .send-btn:active {
      transform: scale(0.85);
    }
    .send-btn:disabled {
      background: var(--surface-alt);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: popIn 0.5s var(--spring) forwards;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 32px;
      background: var(--accent-muted);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .empty-title {
      font-family: var(--font-display);
      font-size: 24px;
      margin-bottom: 8px;
    }
    .empty-desc {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
      padding: 0 12px;
    }
    .suggestion-pills {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .pill {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      color: var(--fg);
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill:active {
      transform: scale(0.97);
      background: var(--surface-alt);
    }
    .pill svg {
      color: var(--muted);
    }

    /* Loading / Thinking */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      width: fit-content;
      animation: popIn 0.4s var(--spring) forwards;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Error State */
    .error-state {
      margin-top: 12px;
      padding: 16px;
      background: oklch(98% 0.02 25);
      border: 1px solid var(--error);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: popIn 0.4s var(--spring) forwards;
    }
    .error-title {
      color: var(--error);
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error-desc {
      font-size: 14px;
      color: var(--fg);
      line-height: 1.4;
    }
    .retry-btn {
      align-self: flex-start;
      padding: 8px 16px;
      background: var(--error);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s var(--spring);
    }
    .retry-btn:active {
      transform: scale(0.95);
    }

    /* Tweaks Panel */
    .tweaks-panel {
      position: fixed;
      top: 24px;
      right: 24px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 1px solid #e5e5e5;
      font-family: var(--font-body);
      width: 240px;
    }
    .tweaks-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .tweak-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tweak-btn {
      padding: 8px 12px;
      border: 1px solid #e5e5e5;
      background: #f9f9f9;
      border-radius: 6px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      transition: all 0.1s;
    }
    .tweak-btn[data-active="true"] {
      background: #000;
      color: #fff;
      border-color: #000;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [viewState, setViewState] = useState('populated'); // 'empty', 'populated', 'loading', 'error'
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [viewState]);

      return (
        <>
          <div className="device-frame">
            <div className="dynamic-island"></div>
            <div className="status-bar">
              <div className="time">9:41</div>
              <div className="status-icons">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0 M1.42 9a16 16 0 0 1 21.16 0 M8.53 16.11a6 6 0 0 1 6.95 0 M12 20h.01"/></svg>
                <svg width="24" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-2 10H6V8h12v8z"/><path d="M24 10h-2v4h2v-4z"/></svg>
              </div>
            </div>

            <div className="app-root">
              
              <header className="header" data-od-id="header">
                <button className="back-btn" aria-label="Back">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div className="header-info">
                  <h1 className="header-title">Socratic Tutor</h1>
                  <div className="header-subtitle">Macroeconomics 101</div>
                </div>
              </header>

              <main className="chat-scroll" ref={scrollRef} data-od-id="chat-area">
                
                {viewState === 'empty' && (
                  <div className="empty-state">
                    <div className="empty-icon">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <h2 className="empty-title">Ready to explore?</h2>
                    <p className="empty-desc">I won't give you the answers directly. I'll ask questions to help you find them.</p>
                    <div className="suggestion-pills">
                      <button className="pill">
                        Explain Inflation Mechanics
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      </button>
                      <button className="pill">
                        Supply & Demand Curve
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      </button>
                    </div>
                  </div>
                )}

                {(viewState === 'populated' || viewState === 'loading' || viewState === 'error') && (
                  <div className="bubble-row user" data-od-id="chat-msg-1">
                    <div className="bubble user">I don't understand how raising interest rates stops inflation.</div>
                  </div>
                )}

                {(viewState === 'populated' || viewState === 'loading' || viewState === 'error') && (
                  <div className="bubble-row ai" data-od-id="chat-msg-2">
                    <div className="bubble ai">
                      Let's break it down together. If the central bank raises interest rates, what happens to the cost of borrowing money for a business or a person?
                    </div>
                  </div>
                )}

                {(viewState === 'populated' || viewState === 'loading' || viewState === 'error') && (
                  <div className="bubble-row user" data-od-id="chat-msg-3" style={{ animationDelay: '0.1s' }}>
                    <div className="bubble user">It gets more expensive. So they borrow less.</div>
                  </div>
                )}

                {viewState === 'populated' && (
                  <div className="bubble-row ai" data-od-id="chat-msg-4" style={{ animationDelay: '0.2s' }}>
                    <div className="bubble ai">
                      Exactly. And if people and businesses are borrowing less, what happens to their overall spending in the economy?
                    </div>
                  </div>
                )}

                {viewState === 'loading' && (
                  <div className="typing-indicator" aria-label="AI is typing" role="status" style={{ animationDelay: '0.2s' }}>
                    <div className="dot"></div>
                    <div className="dot"></div>
                    <div className="dot"></div>
                  </div>
                )}

                {viewState === 'error' && (
                  <div className="error-state" role="alert" style={{ animationDelay: '0.2s' }}>
                    <div className="error-title">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                      Connection Lost
                    </div>
                    <div className="error-desc">We couldn't reach the learning engine. Please check your connection.</div>
                    <button className="retry-btn" onClick={() => setViewState('loading')}>Try Again</button>
                  </div>
                )}

              </main>

              <footer className="input-area" data-od-id="chat-input">
                <div className="input-box">
                  <input type="text" placeholder="Type your response..." disabled={viewState === 'error' || viewState === 'loading'} />
                  <button className="send-btn" disabled={viewState === 'error' || viewState === 'loading'} aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                  </button>
                </div>
              </footer>

            </div>
            
            <div className="home-indicator"></div>
          </div>

          <div className="tweaks-panel">
            <div className="tweaks-title">State Controls</div>
            <div className="tweak-group">
              {['empty', 'populated', 'loading', 'error'].map(state => (
                <button 
                  key={state}
                  className="tweak-btn" 
                  data-active={viewState === state}
                  onClick={() => setViewState(state)}
                >
                  {state.charAt(0).toUpperCase() + state.slice(1)} State
                </button>
              ))}
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
